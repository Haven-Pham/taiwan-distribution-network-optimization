name: Full reproduction

# Reruns every optimisation from the committed geography. It takes over an hour, so it runs on request.
on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/run_experiments.py
      - run: python scripts/run_notebook.py
      - run: python scripts/build_excel_report.py
      - run: python scripts/build_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-results
          path: |
            notebooks/
            reports/
            dashboard/data.json
